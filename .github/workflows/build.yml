name: Build NAMBI APK

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      flutter-version: '3.22.0'
      channel: stable
      cache: true

  - name: Check project files
    run: |
      echo "Checking NAMBI project..."
      ls -la
      test -f pubspec.yaml
      test -f lib/main.dart

  - name: Remove missing icon asset reference
    run: |
      if [ ! -f assets/icon.png ]; then
        echo "Icon not found. Removing only the missing icon asset reference."
        sed -i '\|assets/icon.png|d' pubspec.yaml
      fi

  - name: Create Android project files if missing
    run: |
      if [ ! -d android ]; then
        flutter create --platforms=android --org com.nambi.app --project-name nambi_app .
      fi

  - name: Get Flutter dependencies
    run: flutter pub get

  - name: Build NAMBI release APK
    run: flutter build apk --release

  - name: Upload NAMBI APK
    uses: actions/upload-artifact@v4
    with:
      name: NAMBI-APK
      path: build/app/outputs/flutter-apk/app-release.apk
      if-no-files-found: error
