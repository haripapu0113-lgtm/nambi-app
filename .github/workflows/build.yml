name: Build NAMBI APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: |
          cp lib/main.dart /tmp/bak.dart || true
          flutter create --platforms=android . --org com.nambi.app --project-name nambi_app
          cp /tmp/bak.dart lib/main.dart || true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: NAMBI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
