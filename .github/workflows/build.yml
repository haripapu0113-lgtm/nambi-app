name: Build NAMBI APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Backup main.dart
        run: cp lib/main.dart /tmp/main.dart.bak

      - name: Create android folder
        run: flutter create --platforms=android --org com.nambi.app --project-name nambi_app . --no-pub

      - name: Restore main.dart
        run: cp /tmp/main.dart.bak lib/main.dart

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: NAMBI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
