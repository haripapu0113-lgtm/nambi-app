name: Build NAMBI APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Backup main.dart
        run: |
          if [ -f lib/main.dart ]; then cp lib/main.dart /tmp/main.dart.bak; echo "backup ok"; fi

      - name: Create android folder
        run: flutter create --platforms=android --org com.nambi.app --project-name nambi_app . --no-pub

      - name: Restore main.dart
        run: |
          if [ -f /tmp/main.dart.bak ]; then cp /tmp/main.dart.bak lib/main.dart; fi

      - run: flutter pub get

      - name: Generate icon
        run: |
          if [ -f assets/icon.png ]; then
            dart run flutter_launcher_icons
          else
            echo "icon.png not found, building with default icon"
          fi

      - run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NAMBI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
