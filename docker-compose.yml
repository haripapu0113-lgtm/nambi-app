services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - nambi_models:/root/.ollama
    restart: unless-stopped

  nambi-server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      OLLAMA_URL: http://ollama:11434
      NAMBI_MODEL: qwen2.5:1.5b
      ALLOWED_ORIGIN: http://localhost:5500
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  nambi_models:
