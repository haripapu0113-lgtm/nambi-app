
services:
  ollama:
    image: ollama/ollama:latest
    container_name: nambi-ollama
    volumes:
      - nambi_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  model-init:
    image: ollama/ollama:latest
    container_name: nambi-model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "qwen2.5:1.5b"]
    restart: "no"

  nambi-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nambi-server
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      OLLAMA_URL: http://ollama:11434
      NAMBI_MODEL: qwen2.5:1.5b
      ALLOWED_ORIGINS: https://haripapu0113-lgtm.github.io
    depends_on:
      model-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  nambi_models:
  
